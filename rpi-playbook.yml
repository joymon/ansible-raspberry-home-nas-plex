# code: language=ansible
- name: Machine-Level
  hosts: pis
  user: pi
  become: yes
  become_user: root
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - debug: msg="Ansible running in {{ansible_facts['lsb']['id']}}!"
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        upgrade: yes
        update_cache: yes
      become: yes
- name: NAS
  import_playbook: nas-playbook.yml 
- name: Samba
  import_playbook: samba-playbook.yml
- name: Plex
  import_playbook: plex-playbook.yml
- name: Docker
  import_playbook: docker-playbook.yml
